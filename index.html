<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#10231d">
  <title>SURVIVAL ISLAND — Protótipo 0.1</title>
  <style>
    :root { color-scheme: dark; --panel:rgba(10,22,19,.82); --line:rgba(214,239,222,.18); --accent:#a7d66d; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#10231d; font-family:Inter,system-ui,Segoe UI,sans-serif; color:#f4f6ed; }
    #game { position:fixed; inset:0; }
    canvas { display:block; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(12px); box-shadow:0 10px 35px #0004; }
    #brand { position:fixed; top:14px; left:14px; padding:12px 15px; min-width:210px; }
    #brand strong { display:block; letter-spacing:.16em; font-size:13px; color:var(--accent); }
    #brand span { display:block; margin-top:4px; color:#c4d2c6; font-size:11px; }
    #stats { position:fixed; top:14px; right:14px; display:flex; gap:8px; }
    .stat { padding:10px 12px; min-width:82px; text-align:center; }
    .stat b { display:block; font-size:17px; color:var(--accent); }
    .stat small { color:#c4d2c6; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    #help { position:fixed; left:14px; bottom:14px; padding:12px 14px; max-width:300px; font-size:12px; line-height:1.55; color:#d8e3d7; }
    #help b { color:var(--accent); }
    #message { position:fixed; left:50%; top:22%; transform:translate(-50%,-10px); opacity:0; transition:.2s; padding:11px 16px; pointer-events:none; }
    #message.show { opacity:1; transform:translate(-50%,0); }
    #inventory { position:fixed; right:14px; bottom:14px; width:210px; padding:12px 14px; }
    #inventory h3 { margin:0 0 8px; font-size:12px; color:var(--accent); letter-spacing:.1em; }
    .item { display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid #ffffff14; font-size:12px; }
    .item span:last-child { font-weight:700; }
    #touch { display:none; position:fixed; left:14px; bottom:18px; gap:8px; align-items:end; }
    .pad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,48px); gap:5px; }
    .touchbtn { border:1px solid #ffffff35; border-radius:12px; background:#10231dcc; color:white; font-size:18px; touch-action:none; }
    .touchbtn:active { background:#527b42; }
    #actions { display:flex; flex-direction:column; gap:7px; margin-left:8px; }
    #actions button { min-width:72px; height:45px; font-size:11px; font-weight:700; }
    #crosshair { position:fixed; left:50%; top:50%; width:5px; height:5px; border-radius:50%; background:#fff9; box-shadow:0 0 0 3px #0003; pointer-events:none; }
    @media (max-width:700px) {
      #brand { top:8px; left:8px; min-width:0; padding:9px 11px; }
      #brand span { display:none; }
      #stats { top:8px; right:8px; gap:4px; }
      .stat { min-width:57px; padding:7px 6px; }
      .stat b { font-size:14px; }
      .stat small { font-size:8px; }
      #help { display:none; }
      #inventory { right:8px; bottom:8px; width:145px; padding:9px; }
      #touch { display:flex; }
      .pad { grid-template-columns:repeat(3,42px); grid-template-rows:repeat(2,42px); }
      .touchbtn { font-size:15px; }
      #actions { margin-left:3px; }
      #actions button { min-width:58px; height:42px; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="brand" class="panel"><strong>SURVIVAL ISLAND</strong><span>PROTÓTIPO 0.1 · SOBREVIVE E EXPLORA</span></div>
  <div id="stats">
    <div class="stat panel"><b id="health">100</b><small>Vida</small></div>
    <div class="stat panel"><b id="day">1</b><small>Dia</small></div>
  </div>
  <div id="help" class="panel"><b>CONTROLos</b><br>W A S D — mover · Rato — câmara<br>ESPAÇO — saltar · E — recolher recurso<br>Recolhe madeira e pedra para preparar a tua sobrevivência.</div>
  <div id="inventory" class="panel"><h3>INVENTÁRIO</h3><div class="item"><span>🪵 Madeira</span><span id="wood">0</span></div><div class="item"><span>🪨 Pedra</span><span id="stone">0</span></div><div class="item"><span>🍓 Alimento</span><span id="food">0</span></div></div>
  <div id="message" class="panel"></div>
  <div id="crosshair"></div>
  <div id="touch">
    <div class="pad">
      <span></span><button class="touchbtn" data-key="w">▲</button><span></span>
      <button class="touchbtn" data-key="a">◀</button><button class="touchbtn" data-key="s">▼</button><button class="touchbtn" data-key="d">▶</button>
    </div>
    <div id="actions"><button class="touchbtn" id="jump">SALTAR</button><button class="touchbtn" id="gather">RECOLHER</button></div>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const mount = document.getElementById('game');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bc9d0);
    scene.fog = new THREE.Fog(0x9bc9d0, 42, 115);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 220);
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdaf3ff, 0x536044, 2.0));
    const sun = new THREE.DirectionalLight(0xfff1d2, 2.2);
    sun.position.set(-28, 48, 22);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
    sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
    scene.add(sun);

    const water = new THREE.Mesh(new THREE.PlaneGeometry(220,220), new THREE.MeshStandardMaterial({color:0x287f91, roughness:.32, metalness:.12}));
    water.rotation.x = -Math.PI/2; water.position.y = -1.1; scene.add(water);

    function heightAt(x,z) {
      const r = Math.sqrt(x*x + z*z);
      return Math.max(-.3, 1.2 + Math.sin(x*.13)*.7 + Math.cos(z*.11)*.65 + Math.sin((x+z)*.08)*.45 - Math.max(0,r-24)*.13);
    }
    const verts=[], indices=[], size=100, divisions=100;
    for(let iz=0;iz<=divisions;iz++) for(let ix=0;ix<=divisions;ix++) {
      const x=(ix/divisions-.5)*size, z=(iz/divisions-.5)*size;
      verts.push(x,heightAt(x,z),z);
    }
    for(let iz=0;iz<divisions;iz++) for(let ix=0;ix<divisions;ix++) {
      const a=iz*(divisions+1)+ix, b=a+1, c=a+divisions+1, d=c+1;
      indices.push(a,c,b,b,c,d);
    }
    const terrainGeo=new THREE.BufferGeometry();
    terrainGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    terrainGeo.setIndex(indices); terrainGeo.computeVertexNormals();
    const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({color:0x6e9b52, roughness:1}));
    terrain.receiveShadow=true; scene.add(terrain);

    const sand=new THREE.Mesh(new THREE.RingGeometry(25,35,100),new THREE.MeshStandardMaterial({color:0xc8b47a, side:THREE.DoubleSide, roughness:1}));
    sand.rotation.x=-Math.PI/2; sand.position.y=-.15; scene.add(sand);

    const obstacles=[];
    const resources=[];
    const trunkMat=new THREE.MeshStandardMaterial({color:0x765034});
    const leafMats=[0x2f7046,0x3f8050,0x477f45].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
    function addTree(x,z) {
      const y=heightAt(x,z);
      const group=new THREE.Group(); group.position.set(x,y,z);
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.34,2.5,7),trunkMat); trunk.position.y=1.25; trunk.castShadow=true; group.add(trunk);
      const crown=new THREE.Mesh(new THREE.ConeGeometry(1.55,3.2,8),leafMats[Math.floor(Math.random()*leafMats.length)]);
      crown.position.y=3.35; crown.castShadow=true; group.add(crown);
      scene.add(group); obstacles.push({x,z,r:.75});
      resources.push({mesh:group,x,z,type:'wood',amount:3,active:true});
    }
    const rockMat=new THREE.MeshStandardMaterial({color:0x858b87,roughness:1});
    function addRock(x,z) {
      const y=heightAt(x,z);
      const mesh=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+Math.random()*.45,0),rockMat);
      mesh.position.set(x,y+.45,z); mesh.scale.y=.75; mesh.rotation.set(Math.random(),Math.random(),Math.random()); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh);
      obstacles.push({x,z,r:.75}); resources.push({mesh,x,z,type:'stone',amount:2,active:true});
    }
    function addBush(x,z) {
      const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.65,1),new THREE.MeshStandardMaterial({color:0x8eaa4c}));
      mesh.position.set(x,heightAt(x,z)+.45,z); mesh.scale.set(1,.75,1); scene.add(mesh);
      resources.push({mesh,x,z,type:'food',amount:2,active:true});
    }
    let seed=731;
    function rand(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
    for(let i=0;i<85;i++) {
      const angle=rand()*Math.PI*2, radius=7+rand()*37;
      const x=Math.cos(angle)*radius,z=Math.sin(angle)*radius;
      if(Math.hypot(x,z)<5) continue;
      const roll=rand();
      if(roll<.62) addTree(x,z); else if(roll<.88) addRock(x,z); else addBush(x,z);
    }

    // Personagem bárbara: corpo estilizado, equipamento de couro, peles e barba.
    const player=new THREE.Group();
    const skinMat=new THREE.MeshStandardMaterial({color:0xb97850,roughness:.88});
    const skinLight=new THREE.MeshStandardMaterial({color:0xc98b61,roughness:.9});
    const leatherMat=new THREE.MeshStandardMaterial({color:0x493023,roughness:1});
    const leatherLight=new THREE.MeshStandardMaterial({color:0x765039,roughness:1});
    const furMat=new THREE.MeshStandardMaterial({color:0x8a7658,roughness:1});
    const darkMat=new THREE.MeshStandardMaterial({color:0x211c18,roughness:1});
    const metalMat=new THREE.MeshStandardMaterial({color:0x777d79,metalness:.65,roughness:.35});
    const braidMat=new THREE.MeshStandardMaterial({color:0x4a2b1d,roughness:1});
    function part(parent,geo,mat,x,y,z,sx=1,sy=1,sz=1){
      const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
    }
    function capsuleBetween(parent,a,b,r,mat){
      const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),dir=end.clone().sub(start);
      const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(.01,dir.length()-r*2),4,8),mat);
      m.position.copy(start).add(end).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());m.castShadow=true;parent.add(m);return m;
    }

    // Tronco musculado e colete curto de couro.
    part(player,new THREE.CapsuleGeometry(.43,.68,5,10),skinMat,0,1.28,0,1.22,1,0.9);
    part(player,new THREE.BoxGeometry(.78,.62,.48),leatherMat,0,1.31,.015,.0+1,1,1);
    part(player,new THREE.SphereGeometry(.34,16,12),skinLight,-.22,1.48,-.02,.92,.72,.78);
    part(player,new THREE.SphereGeometry(.34,16,12),skinLight,.22,1.48,-.02,.92,.72,.78);
    // Cinto, fivela e saiote de couro.
    part(player,new THREE.CylinderGeometry(.43,.46,.13,12),leatherLight,0,.88,0,1,1,.88);
    part(player,new THREE.BoxGeometry(.16,.17,.07),metalMat,0,.88,-.27);
    part(player,new THREE.ConeGeometry(.48,.62,6),leatherMat,0,.53,0,1,.8,.8);
    part(player,new THREE.BoxGeometry(.18,.55,.08),leatherLight,-.18,.53,-.31,.65,1,.7);
    part(player,new THREE.BoxGeometry(.18,.55,.08),leatherLight,.18,.53,-.31,.65,1,.7);

    // Cabeça, cabelo comprido, barba e tranças.
    part(player,new THREE.SphereGeometry(.29,18,14),skinLight,0,2.02,-.015,1,1.12,.92);
    part(player,new THREE.SphereGeometry(.305,16,12),darkMat,0,2.19,.035,1.03,.58,1.02);
    part(player,new THREE.BoxGeometry(.12,.38,.13),braidMat,-.31,1.99,.02,.8,1,1);
    part(player,new THREE.BoxGeometry(.12,.38,.13),braidMat,.31,1.99,.02,.8,1,1);
    part(player,new THREE.SphereGeometry(.235,16,12),braidMat,0,1.83,-.19,1,.8,.62);
    part(player,new THREE.ConeGeometry(.19,.48,8),braidMat,0,1.55,-.19,1,1,.85);
    part(player,new THREE.SphereGeometry(.045,10,8),darkMat,-.105,2.055,-.275,1,1,.55);
    part(player,new THREE.SphereGeometry(.045,10,8),darkMat,.105,2.055,-.275,1,1,.55);
    // Ombreiras de pele e correias cruzadas.
    part(player,new THREE.SphereGeometry(.29,12,10),furMat,-.49,1.72,0,1.25,.72,1);
    part(player,new THREE.SphereGeometry(.29,12,10),furMat,.49,1.72,0,1.25,.72,1);
    const strap=part(player,new THREE.BoxGeometry(.13,.95,.09),leatherLight,.17,1.39,-.27,1,1,1);strap.rotation.z=-.36;
    const strap2=part(player,new THREE.BoxGeometry(.13,.95,.09),leatherLight,-.17,1.39,-.27,1,1,1);strap2.rotation.z=.36;

    // Braços articulados para a animação de caminhada.
    const arms=[];
    for(const side of [-1,1]){
      const arm=new THREE.Group();arm.position.set(side*.56,1.67,0);player.add(arm);arms.push(arm);
      capsuleBetween(arm,[0,-.08,0],[side*.08,-.48,-.015],.17,skinMat);
      capsuleBetween(arm,[side*.08,-.48,-.015],[side*.1,-.83,-.06],.135,skinLight);
      part(arm,new THREE.CylinderGeometry(.16,.14,.2,10),leatherMat,side*.1,-.68,-.04,1,1,1);
      for(let i=0;i<3;i++){const band=part(arm,new THREE.CylinderGeometry(.145,.145,.055,10),leatherLight,side*.1,-.54-i*.09,-.04);band.rotation.z=side*-.12;}
      part(arm,new THREE.SphereGeometry(.14,12,10),skinMat,side*.1,-.88,-.06,1,.8,1);
    }

    // Pernas com calças de couro e botas.
    const legs=[];
    for(const side of [-1,1]){
      const leg=new THREE.Group();leg.position.set(side*.22,.82,0);player.add(leg);legs.push(leg);
      part(leg,new THREE.CapsuleGeometry(.16,.53,4,8),leatherMat,0,-.31,0,1,1,.95);
      part(leg,new THREE.CapsuleGeometry(.14,.36,4,8),skinMat,0,-.68,0,1,1,.95);
      part(leg,new THREE.CylinderGeometry(.19,.2,.3,9),leatherLight,0,-.86,-.035,1,1,1);
      part(leg,new THREE.BoxGeometry(.3,.16,.48),darkMat,0,-.98,-.11,1,1,1);
    }
    // Machado simples preso às costas: identidade visual de sobrevivente bárbaro.
    const axe=new THREE.Group();axe.position.set(.34,1.35,.28);axe.rotation.z=-.22;player.add(axe);
    part(axe,new THREE.CylinderGeometry(.035,.045,.95,8),leatherLight,0,0,0);
    const blade=part(axe,new THREE.BoxGeometry(.38,.32,.07),metalMat,-.16,.36,0,1,1,1);blade.rotation.z=-.35;
    part(axe,new THREE.SphereGeometry(.07,10,8),leatherMat,0,-.48,0);
    player.position.set(0,heightAt(0,0),0); scene.add(player);

    const keys={w:false,a:false,s:false,d:false};
    const inventory={wood:0,stone:0,food:0};
    let yaw=0, pitch=.28, vertical=0, grounded=true, pointerLocked=false, walkTime=0;
    const clock=new THREE.Clock();
    const message=document.getElementById('message');
    let messageTimer;
    function notify(text){message.textContent=text;message.classList.add('show');clearTimeout(messageTimer);messageTimer=setTimeout(()=>message.classList.remove('show'),1800);}
    function refresh(){for(const k of Object.keys(inventory))document.getElementById(k).textContent=inventory[k];}
    function nearestResource(){
      let best=null,dist=3.3;
      for(const r of resources) if(r.active){const d=Math.hypot(r.x-player.position.x,r.z-player.position.z);if(d<dist){best=r;dist=d;}}
      return best;
    }
    function gather(){
      const r=nearestResource();
      if(!r){notify('Aproxima-te de uma árvore, rocha ou arbusto.');return;}
      inventory[r.type]+=r.amount; refresh();
      r.active=false; scene.remove(r.mesh);
      notify(r.type==='wood'?'Recolheste madeira.':r.type==='stone'?'Recolheste pedra.':'Recolheste alimento.');
    }
    function jump(){if(grounded){vertical=7.2;grounded=false;}}
    window.addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if(k in keys)keys[k]=true;
      if(k===' ')jump();
      if(k==='e')gather();
    });
    window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false;});
    renderer.domElement.addEventListener('click',()=>{if(innerWidth>700 && renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();});
    document.addEventListener('pointerlockchange',()=>pointerLocked=document.pointerLockElement===renderer.domElement);
    document.addEventListener('mousemove',e=>{if(pointerLocked){yaw-=e.movementX*.0025;pitch=Math.max(-.05,Math.min(.85,pitch+e.movementY*.0018));}});
    document.querySelectorAll('[data-key]').forEach(btn=>{
      const k=btn.dataset.key;
      const down=e=>{e.preventDefault();keys[k]=true;};
      const up=e=>{e.preventDefault();keys[k]=false;};
      btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up);
    });
    document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
    document.getElementById('gather').addEventListener('pointerdown',e=>{e.preventDefault();gather();});

    const cameraOffset=new THREE.Vector3();
    function animate(){
      requestAnimationFrame(animate);
      const dt=Math.min(clock.getDelta(),.04);
      const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
      const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
      const move=new THREE.Vector3();
      if(keys.w)move.add(forward);if(keys.s)move.sub(forward);if(keys.d)move.add(right);if(keys.a)move.sub(right);
      const moving=move.lengthSq()>0;
      if(moving){
        move.normalize(); player.position.addScaledVector(move,5.2*dt);
        player.rotation.y=Math.atan2(move.x,move.z);
        walkTime+=dt*10;
        legs[0].rotation.x=Math.sin(walkTime)*.55;legs[1].rotation.x=-Math.sin(walkTime)*.55;arms[0].rotation.x=-Math.sin(walkTime)*.38;arms[1].rotation.x=Math.sin(walkTime)*.38;
      } else {legs[0].rotation.x*=.8;legs[1].rotation.x*=.8;arms[0].rotation.x*=.8;arms[1].rotation.x*=.8;}
      const radius=Math.hypot(player.position.x,player.position.z);
      if(radius>46){player.position.x*=46/radius;player.position.z*=46/radius;}
      for(const o of obstacles){const dx=player.position.x-o.x,dz=player.position.z-o.z,d=Math.hypot(dx,dz);if(d<1.0){player.position.x+=dx/(d||1)*.035;player.position.z+=dz/(d||1)*.035;}}
      vertical-=18*dt;player.position.y+=vertical*dt;
      const ground=heightAt(player.position.x,player.position.z);
      if(player.position.y<=ground){player.position.y=ground;vertical=0;grounded=true;}
      cameraOffset.set(Math.sin(yaw)*8,3.4+pitch*2,Math.cos(yaw)*8);
      camera.position.copy(player.position).add(cameraOffset);
      const look=new THREE.Vector3(player.position.x,player.position.y+1.2,player.position.z);
      camera.lookAt(look);
      renderer.render(scene,camera);
    }
    animate();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));});
    refresh();
    notify('Bem-vindo à ilha. Começa por recolher recursos.');
  </script>
</body>
</html>
